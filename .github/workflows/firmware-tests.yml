name: Firmware simulation tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    name: Run firmware in the 80C552 simulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulate one full wash cycle
        run: python tools/sim/run_sim.py

      - name: Run the test suite
        run: python -m unittest discover -s tools/sim -v
